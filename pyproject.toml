[project]
# Vercel's Python builder runs `uv lock`, which requires this table. The
# dependency list here MUST stay identical to requirements.txt — two sources of
# truth is exactly how a deployed app ends up with different versions than the
# one that was tested. tests/test_packaging.py fails if they diverge.
name = "disclosure-checklist-agent"
version = "0.1.0"
description = "DMV seller-disclosure checklist agent"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.8.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "jinja2==3.1.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyYAML==6.0.3",
    "cryptography==46.0.3",
    "httpx==0.28.1",
]

[tool.uv]
# Not an installable package, just a dependency set.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "__pycache__"]

# Ruff 0.16 formats Python inside Markdown code fences. SPEC.md and BUILD.md
# are documents, not source — their snippets are illustrative and must stay as
# written. Without this, `ruff format .` silently edits the spec.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
